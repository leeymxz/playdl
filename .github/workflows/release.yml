name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: .exe
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ''
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: ''
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: ''
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build playdl + pdl
        run: cargo build --release --target ${{ matrix.target }} --bin playdl --bin pdl

      - name: Prepare artifacts
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          DIR="playdl-${TAG}-${{ matrix.target }}"
          mkdir -p "$DIR"

          cp "target/${{ matrix.target }}/release/playdl${{ matrix.suffix }}" "$DIR/"
          cp "target/${{ matrix.target }}/release/pdl${{ matrix.suffix }}" "$DIR/"

          # 复制安装脚本和文档
          cp README.md "$DIR/"
          cp docs/logo.png "$DIR/" 2>/dev/null || true
          cp docs/playdl.ico "$DIR/" 2>/dev/null || true

          # 复制 GUI 脚本（仅 Windows）
          if [ "${{ matrix.suffix }}" = ".exe" ]; then
            cp gui/PlayDL.ps1 "$DIR/" 2>/dev/null || true
            cp gui/PlayDL.bat "$DIR/" 2>/dev/null || true
            cp 打开终端.bat "$DIR/" 2>/dev/null || true
            cp 下载器菜单.bat "$DIR/" 2>/dev/null || true
          fi

          # 打包
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${DIR}.zip" "$DIR/"
            echo "ARCHIVE=${DIR}.zip" >> $GITHUB_ENV
          else
            tar czf "${DIR}.tar.gz" "$DIR/"
            echo "ARCHIVE=${DIR}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: playdl-${{ matrix.target }}
          path: playdl-*-${{ matrix.target }}.*

  installer:
    name: Build Windows Installer
    needs: [build]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: playdl-x86_64-pc-windows-msvc
          path: artifacts

      - name: Extract build zip
        shell: bash
        run: |
          cd artifacts
          unzip -o "playdl-*.zip" -d extracted/
          # 复制到 Inno Setup 预期的路径
          mkdir -p ../target/release
          cp extracted/*/playdl.exe ../target/release/ 2>/dev/null || cp extracted/playdl.exe ../target/release/ 2>/dev/null || true
          cp extracted/*/pdl.exe ../target/release/ 2>/dev/null || cp extracted/pdl.exe ../target/release/ 2>/dev/null || true
          ls -la ../target/release/

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          echo "ISCC installed"

      - name: Build installer
        shell: cmd
        run: |
          cd packaging\innosetup
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" PlayDL.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: playdl-windows-installer
          path: packaging\dist\PlayDL-Setup-*.exe

  release:
    name: Create Release
    needs: [build, installer]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Collect archives
        shell: bash
        run: |
          find . -name "*.zip" -o -name "*.tar.gz" | while read f; do
            mv "$f" .
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: PlayDL ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            *.zip
            *.tar.gz