name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            os_tag: windows
            arch_tag: amd64
            suffix: .exe
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            os_tag: linux
            arch_tag: amd64
            suffix: ''
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            os_tag: macos
            arch_tag: amd64
            suffix: ''
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            os_tag: macos
            arch_tag: arm64
            suffix: ''
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build playdl + pdl
        run: cargo build --release --target ${{ matrix.target }} --bin playdl --bin pdl

      - name: Prepare artifacts
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          DIR="playdl-${TAG}-${{ matrix.os_tag }}-${{ matrix.arch_tag }}"
          mkdir -p "$DIR"

          cp "target/${{ matrix.target }}/release/playdl${{ matrix.suffix }}" "$DIR/"
          cp "target/${{ matrix.target }}/release/pdl${{ matrix.suffix }}" "$DIR/"

          # 复制安装脚本和文档
          cp README.md "$DIR/"
          cp docs/logo.png "$DIR/" 2>/dev/null || true
          cp docs/playdl.ico "$DIR/" 2>/dev/null || true

          # 复制 GUI 脚本（仅 Windows）
          if [ "${{ matrix.suffix }}" = ".exe" ]; then
            cp gui/PlayDL.ps1 "$DIR/" 2>/dev/null || true
            cp gui/PlayDL.bat "$DIR/" 2>/dev/null || true
            cp 打开终端.bat "$DIR/" 2>/dev/null || true
            cp 下载器菜单.bat "$DIR/" 2>/dev/null || true
          fi

          # 打包
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${DIR}.zip" "$DIR/"
            echo "ARCHIVE=${DIR}.zip" >> $GITHUB_ENV
          else
            tar czf "${DIR}.tar.gz" "$DIR/"
            echo "ARCHIVE=${DIR}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: playdl-${{ matrix.os_tag }}-${{ matrix.arch_tag }}
          path: playdl-*-${{ matrix.os_tag }}-${{ matrix.arch_tag }}.*

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Collect archives
        shell: bash
        run: |
          find . -name "*.zip" -o -name "*.tar.gz" | while read f; do
            mv "$f" .
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: PlayDL ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            *.zip
            *.tar.gz