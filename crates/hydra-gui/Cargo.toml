[package]
name = "pdl-gui"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"
repository.workspace = true
homepage.workspace = true
description = "PlayDL download manager desktop GUI (cross platform)"
publish = false

[[bin]]
name = "playdl-gui"
path = "src/main.rs"

[dependencies]
pdl-core = { workspace = true }
pdl-net = { workspace = true }
pdl-stream = { workspace = true }
pdl-updater = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
iced = { version = "0.14", features = ["tokio", "svg", "image", "advanced"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "1"
open = "5"
system_shutdown = "4"
rfd = "0.17"
redb = "4"
rodio = { version = "0.22", default-features = false, features = ["wav", "vorbis", "playback"] }
display-info = "0.5"
png = "0.18"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
x11rb = "0.13"

[build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSColorSpace", "NSView", "NSWindow", "NSGraphics"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
dark-light = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"
blake3 = { version = "1", features = ["pure"] }

[dev-dependencies]
aes = { workspace = true }
cbc = { workspace = true }
zip = { version = "8", default-features = false, features = ["deflate"] }

[lints]
workspace = true