[package]
name = "playdl-desktop"
version = "0.2.0"
edition = "2021"
description = "PlayDL desktop GUI - native IDM-style download manager window"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "playdl-desktop"
path = "src/main.rs"

[dependencies]
# 原生 GUI 框架（真窗口，不用浏览器）
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true