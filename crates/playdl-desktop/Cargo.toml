[package]
name = "playdl-desktop"
version = "0.1.0"
edition = "2021"
description = "PlayDL desktop GUI - double-click download manager"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "playdl-desktop"
path = "src/main.rs"

[dependencies]
# 轻量本地 HTTP 服务器
tiny_http = "0.12"
# JSON 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 打开默认浏览器
webbrowser = "1"

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true