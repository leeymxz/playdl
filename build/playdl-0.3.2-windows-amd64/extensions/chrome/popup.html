<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" width="20" height="20" />
      <span class="title">PlayDL</span>
      <span id="status" class="status" title="">●</span>
    </header>

    <label class="row toggle">
      <input type="checkbox" id="enabled" />
      <span>Capture downloads</span>
    </label>

    <label class="row toggle">
      <input type="checkbox" id="video-panel" />
      <span>Download button on videos</span>
    </label>

    <!-- 视频链接解析（借鉴解析站模式，走 yt-dlp） -->
    <section id="video-dl" class="video-dl">
      <input type="text" id="video-url" placeholder="粘贴视频链接 (YouTube/B站/抖音/TikTok...)" spellcheck="false" />
      <button id="video-go">解析下载</button>
    </section>

    <div class="actions">
      <button id="open-playdl">Open PlayDL</button>
      <button id="all-links">Download all links</button>
    </div>

    <section id="stream-section" hidden>
      <h2>Streams on this page</h2>
      <ul id="stream-list"></ul>
    </section>

    <section id="media-section" hidden>
      <h2>Media on this page</h2>
      <label class="row toggle small">
        <input type="checkbox" id="media-best" />
        <span>Best quality only</span>
      </label>
      <ul id="media-list"></ul>
    </section>

    <footer id="hint"></footer>
    <script src="popup.js"></script>
  </body>
</html>
